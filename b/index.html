<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>쉬는 시간 10분</title>
<style>
  :root{
    --bg:#eef6f2; --ink:#1f2d2a; --muted:#6c7f79; --line:#cfe1d9; --card:#ffffff;
    --accent:#1f8a5b; --phone:#111; --bad:#d9534f; --blue:#2878ff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif}
  button{font:inherit;cursor:pointer}
  .wrap{max-width:1100px;margin:0 auto;padding:16px}
  .hidden{display:none !important}
  .center{min-height:90vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center}
  h1{font-size:44px;margin:0} h2{font-size:34px;margin:0}
  .muted{color:var(--muted);font-size:20px;margin:0}
  .bigbtn{background:var(--accent);color:#fff;border:0;border-radius:14px;padding:16px 40px;font-size:24px;font-weight:800}
  .ghost{background:#fff;border:2px solid var(--accent);color:var(--accent);border-radius:14px;padding:14px 26px;font-size:20px;font-weight:800}
  .opts{display:flex;gap:18px;color:var(--muted);font-size:17px}
  .steps{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
  .step{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px 22px;min-width:240px;font-size:21px;font-weight:700}
  .step small{display:block;color:var(--muted);font-size:15px;margin-bottom:6px}

  /* 상단 바 */
  .bar{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:#1f2d2a;color:#eef;border-radius:12px;font-size:18px}
  .bar b{font-size:22px}
  .timer{font-variant-numeric:tabular-nums;font-size:30px;font-weight:800}
  .timer.warn{color:#ff9b8f}

  /* 1라운드: 폰 */
  .stage{display:grid;grid-template-columns:380px 1fr;gap:24px;margin-top:16px;align-items:start}
  .phone{background:var(--phone);border-radius:38px;padding:14px;height:640px;position:relative;box-shadow:0 10px 30px #0003}
  .screen{background:#000;border-radius:28px;height:100%;overflow:hidden;position:relative;color:#fff}
  .video{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;transition:transform .35s}
  .video .emo{font-size:110px;line-height:1}
  .video .tt{font-size:24px;font-weight:800}
  .video .ch{font-size:15px;color:#bbb}
  .video .like{position:absolute;right:16px;bottom:90px;font-size:15px;color:#ddd;display:flex;flex-direction:column;gap:14px;align-items:center}
  .swipe{position:absolute;left:0;right:0;bottom:18px;text-align:center;font-size:14px;color:#aaa}
  .noti{position:absolute;left:12px;right:12px;top:12px;background:#ffffffee;color:#111;border-radius:16px;padding:12px 14px;font-size:15px;box-shadow:0 6px 16px #0006;transform:translateY(-140%);transition:transform .3s}
  .noti.show{transform:translateY(0)}
  .noti b{display:block;font-size:13px;color:#666;margin-bottom:2px}
  .side{display:flex;flex-direction:column;gap:14px}
  .counter{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;font-size:20px}
  .counter .n{font-size:46px;font-weight:900;color:var(--ink)}
  .friends{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
  .friends p{margin:0 0 10px;font-size:18px;color:var(--muted)}
  .talk{background:#e9f7f0;border:2px solid var(--accent);color:var(--accent);border-radius:12px;padding:12px 18px;font-size:19px;font-weight:800}

  /* 기억 퀴즈 */
  .grid6{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:min(820px,100%)}
  .pick{background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px;font-size:19px;font-weight:700;display:flex;gap:10px;align-items:center;text-align:left}
  .pick .e{font-size:34px}
  .pick.on{border-color:var(--blue);background:#e8f0ff}

  /* 2라운드: 폰 없음 */
  .locker{background:var(--card);border:1px dashed var(--line);border-radius:22px;height:640px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--muted);font-size:20px;text-align:center;padding:20px}
  .locker .e{font-size:90px}
  .ideas{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
  .ideas h3{margin:0;font-size:24px}
  .row{display:flex;gap:10px}
  .row input{flex:1;font:inherit;font-size:20px;padding:12px 14px;border:2px solid var(--line);border-radius:12px}
  .row button{border:0;background:var(--accent);color:#fff;border-radius:12px;padding:0 20px;font-size:20px;font-weight:800}
  .list{display:flex;flex-wrap:wrap;gap:8px;min-height:60px}
  .tag{background:#e9f7f0;border-radius:999px;padding:8px 14px;font-size:18px;font-weight:700}
  .tag.hint{background:#fff4d6}
  .hintbtn{align-self:flex-start;background:#fff4d6;border:0;border-radius:12px;padding:10px 16px;font-size:17px;font-weight:800;color:#8a6a00}

  /* 결과 */
  .compare{display:grid;grid-template-columns:1fr 1fr;gap:16px;width:min(820px,100%)}
  .box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;text-align:left;font-size:20px;line-height:1.7}
  .box h4{margin:0 0 6px;color:var(--muted);font-size:16px}
  .box b{font-size:28px}
  .chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:860px}
  .chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:12px 20px;font-size:20px;font-weight:700}
  .chip.on{border-color:var(--blue);background:#e8f0ff;color:var(--blue)}
  .sum{font-size:22px;font-weight:800;min-height:34px}
  .bell{font-size:90px}

  @media (max-width:860px){
    .stage{grid-template-columns:1fr}
    .phone,.locker{height:520px}
    .grid6{grid-template-columns:repeat(2,1fr)}
    .compare{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- 시작 -->
  <section id="s-start" class="center">
    <h1>쉬는 시간 10분</h1>
    <p class="muted">10분을 짧게 줄여서 두 번 겪어 보기</p>
    <div class="steps">
      <div class="step"><small>1회</small>📱 폰 있는 쉬는 시간</div>
      <div class="step"><small>2회</small>🔒 폰 없는 쉬는 시간</div>
      <div class="step"><small>3</small>비교 · 돌아보기</div>
    </div>
    <div class="opts">
      <label><input type="radio" name="t" value="30"> 30초</label>
      <label><input type="radio" name="t" value="60" checked> 60초</label>
      <label><input type="radio" name="t" value="90"> 90초</label>
    </div>
    <button class="bigbtn" id="go1">쉬는 시간 시작</button>
  </section>

  <!-- 1회: 폰 있음 -->
  <section id="s-phone" class="hidden">
    <div class="bar"><span>1회 <b>폰 있는 쉬는 시간</b></span><span class="timer" id="t1">60</span></div>
    <div class="stage">
      <div class="phone">
        <div class="screen" id="screen">
          <div class="video" id="video"></div>
          <div class="noti" id="noti"><b id="notiFrom"></b><span id="notiText"></span></div>
          <div class="swipe">화면을 누르면 다음 영상</div>
        </div>
      </div>
      <div class="side">
        <div class="counter">본 영상 <div class="n" id="cnt">0</div></div>
        <div class="friends">
          <p>옆자리 친구</p>
          <button class="talk" id="talk1">친구에게 말 걸기</button>
          <p id="talkLog1" style="margin-top:10px"></p>
        </div>
      </div>
    </div>
  </section>

  <!-- 종 + 기억 퀴즈 -->
  <section id="s-recall" class="center hidden">
    <div class="bell">🔔</div>
    <h2>수업 종이 울렸다</h2>
    <p class="muted">방금 본 영상을 모두 고르기</p>
    <div class="grid6" id="grid6"></div>
    <button class="bigbtn" id="recallDone">확인</button>
  </section>

  <!-- 2회: 폰 없음 -->
  <section id="s-nophone" class="hidden">
    <div class="bar"><span>2회 <b>폰 없는 쉬는 시간</b></span><span class="timer" id="t2">60</span></div>
    <div class="stage">
      <div class="locker">
        <div class="e">🔒</div>
        <div>휴대폰은 보관함에</div>
        <div style="font-size:26px;font-weight:800;color:var(--ink)">뭐 하지?</div>
      </div>
      <div class="side">
        <div class="ideas">
          <h3>지금 할 수 있는 놀이</h3>
          <div class="row"><input id="ideaIn" placeholder="떠오르는 놀이 쓰기" maxlength="20"><button id="ideaAdd">추가</button></div>
          <div class="list" id="ideaList"></div>
          <button class="hintbtn" id="hint">💡 힌트 하나</button>
        </div>
        <div class="friends">
          <p>옆자리 친구</p>
          <button class="talk" id="talk2">친구에게 말 걸기</button>
          <p id="talkLog2" style="margin-top:10px"></p>
        </div>
      </div>
    </div>
  </section>

  <!-- 결과 -->
  <section id="s-result" class="center hidden">
    <h2>두 번의 쉬는 시간</h2>
    <div class="compare">
      <div class="box"><h4>📱 폰 있음</h4><div id="r1"></div></div>
      <div class="box"><h4>🔒 폰 없음</h4><div id="r2"></div></div>
    </div>
    <button class="bigbtn" id="toReflect">돌아보기</button>
  </section>

  <!-- 돌아보기 -->
  <section id="s-reflect" class="center hidden">
    <h2>폰 없는 쉬는 시간에 무엇이 있으면 좋을까</h2>
    <div class="chips" id="chips"></div>
    <div class="sum" id="sum"></div>
    <button class="ghost" id="home">처음으로</button>
  </section>

</div>
<script>
const VIDEOS = [
  ['🐱','피아노 치는 고양이','냥냥TV'],['✈️','1초 종이비행기','접기왕'],['🍜','라면 10개 먹방','먹방러'],
  ['⚽','골대 맞히기 챌린지','공차기'],['🐶','강아지 몰래카메라','멍멍채널'],['🎮','게임 신기록','겜돌이'],
  ['🧊','얼음 자르기 ASMR','소리방'],['🦖','공룡 춤 챌린지','춤춤'],['🎲','큐브 5초 맞추기','큐브천재'],
  ['🍫','초콜릿 분수','달콤'],['🐧','넘어지는 펭귄','동물짤'],['🚀','로켓 발사 장면','우주채널'],
  ['🎨','손가락 그림 그리기','그림쟁이'],['🤸','덤블링 실패 모음','웃짤'],['🧪','색 바뀌는 실험','실험실'],
  ['🎤','노래 한 소절 챌린지','노래방'],['🦜','말하는 앵무새','새소리'],['🏀','하프라인 슛','농구왕'],
];
const NOTIS = [
  ['민수','게임 ㄱ?'],['알림','새 영상이 올라왔어요'],['지아','이거 봤어? ㅋㅋ'],
  ['알림','이어서 보기: 다음 편'],['반 단톡','(새 메시지 12개)'],['알림','오늘의 인기 영상'],
];
const HINTS = ['공기놀이','끝말잇기','손바닥 치기','종이접기','가위바위보 계단','그림 맞히기','수수께끼','스무고개','실뜨기','팔씨름'];
const CHIPS = ['놀이 목록','인원별 추천','장소별 추천','준비물 안내','규칙 설명','짝 찾기','타이머','가족 약속판'];

const $=id=>document.getElementById(id);
let limit=60,left=60,tick=null,feed=[],idx=0,seen=[],talk1=0,talk2=0,ideas=[],hints=0,recall=null,notiT=null,autoT=null;

function show(id){['s-start','s-phone','s-recall','s-nophone','s-result','s-reflect'].forEach(s=>$(s).classList.toggle('hidden',s!==id));scrollTo(0,0);}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function countdown(el,onEnd){
  left=limit; el.textContent=left; el.classList.remove('warn');
  clearInterval(tick);
  tick=setInterval(()=>{left--;el.textContent=Math.max(left,0);el.classList.toggle('warn',left<=10);if(left<=0){clearInterval(tick);onEnd();}},1000);
}

/* 1회 */
function showVideo(){
  const v=feed[idx%feed.length]; seen.push(v); $('cnt').textContent=seen.length;
  $('video').innerHTML=`<div class="emo">${v[0]}</div><div class="tt">${v[1]}</div><div class="ch">@${v[2]}</div>
    <div class="like"><span>❤️<br>${(Math.random()*90+10|0)}만</span><span>💬<br>${(Math.random()*9+1|0)}천</span><span>↗️</span></div>`;
  idx++;
  clearTimeout(autoT); autoT=setTimeout(showVideo,3000);
}
function popNoti(){
  const n=NOTIS[Math.random()*NOTIS.length|0];
  $('notiFrom').textContent=n[0]; $('notiText').textContent=n[1];
  $('noti').classList.add('show'); setTimeout(()=>$('noti').classList.remove('show'),2200);
}
function startPhone(){
  limit=+document.querySelector('input[name=t]:checked').value;
  feed=shuffle(VIDEOS); idx=0; seen=[]; talk1=0; $('talkLog1').textContent='';
  show('s-phone'); showVideo();
  clearInterval(notiT); notiT=setInterval(popNoti,6000); setTimeout(popNoti,1500);
  countdown($('t1'),endPhone);
}
function endPhone(){
  clearTimeout(autoT); clearInterval(notiT);
  const uniq=[...new Map(seen.map(v=>[v[1],v])).values()];
  const seenPick=shuffle(uniq).slice(0,3);
  const unseen=shuffle(VIDEOS.filter(v=>!uniq.find(u=>u[1]===v[1]))).slice(0,3);
  recall={uniq, options:shuffle([...seenPick,...unseen]), picked:new Set()};
  renderRecall(); show('s-recall');
}
function renderRecall(){
  $('grid6').innerHTML=recall.options.map((v,i)=>`<button class="pick ${recall.picked.has(i)?'on':''}" data-i="${i}"><span class="e">${v[0]}</span>${v[1]}</button>`).join('');
  $('grid6').querySelectorAll('.pick').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;recall.picked.has(i)?recall.picked.delete(i):recall.picked.add(i);renderRecall();});
}

/* 2회 */
function startNoPhone(){
  ideas=[];hints=0;talk2=0;$('ideaList').innerHTML='';$('talkLog2').textContent='';$('ideaIn').value='';
  show('s-nophone'); $('ideaIn').focus();
  countdown($('t2'),endNoPhone);
}
function addIdea(text,isHint){
  text=(text||'').trim(); if(!text||ideas.find(x=>x.t===text))return;
  ideas.push({t:text,h:!!isHint});
  $('ideaList').innerHTML=ideas.map(x=>`<span class="tag ${x.h?'hint':''}">${x.t}</span>`).join('');
}
function endNoPhone(){
  const opts=recall.options, uniq=recall.uniq;
  let right=0; recall.picked.forEach(i=>{ if(uniq.find(u=>u[1]===opts[i][1])) right++; });
  const seenCount=opts.filter(o=>uniq.find(u=>u[1]===o[1])).length;
  const own=ideas.filter(x=>!x.h).length;
  $('r1').innerHTML=`본 영상 <b>${seen.length}</b>개<br>기억해서 맞힌 영상 <b>${right}</b> / ${seenCount}<br>친구와 말한 횟수 <b>${talk1}</b>`;
  $('r2').innerHTML=`스스로 떠올린 놀이 <b>${own}</b>개<br>힌트 사용 <b>${hints}</b>번<br>친구와 말한 횟수 <b>${talk2}</b>`;
  show('s-result');
}

/* 돌아보기 */
const picked=new Set();
function renderReflect(){
  $('chips').innerHTML=CHIPS.map(c=>`<button class="chip ${picked.has(c)?'on':''}">${c}</button>`).join('');
  $('chips').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{const c=b.textContent;picked.has(c)?picked.delete(c):picked.add(c);renderReflect();});
  $('sum').textContent=picked.size?'우리 앱에 넣을 것 → '+[...picked].join(' · '):'';
}

$('go1').onclick=startPhone;
$('screen').onclick=e=>{ if(e.target.closest('.noti'))return; showVideo(); };
$('talk1').onclick=()=>{talk1++;$('talkLog1').textContent=`친구: "응? 잠깐만, 이것만 보고…" (${talk1})`;};
$('talk2').onclick=()=>{talk2++;$('talkLog2').textContent=`친구: "그래, 뭐 할까?" (${talk2})`;};
$('recallDone').onclick=startNoPhone;
$('ideaAdd').onclick=()=>{addIdea($('ideaIn').value);$('ideaIn').value='';$('ideaIn').focus();};
$('ideaIn').onkeydown=e=>{ if(e.key==='Enter' && !e.isComposing){ $('ideaAdd').click(); } };
$('hint').onclick=()=>{const rest=HINTS.filter(h=>!ideas.find(x=>x.t===h)); if(!rest.length)return; hints++; addIdea(rest[Math.random()*rest.length|0],true);};
$('toReflect').onclick=()=>{renderReflect();show('s-reflect');};
$('home').onclick=()=>{picked.clear();show('s-start');};
</script>
</body>
</html>
